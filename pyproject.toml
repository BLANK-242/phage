[project]
name = "phage"
version = "0.1.0"
description = "PHAGE — an immune system for AI agent fleets: tailored prompt-injection red-teaming, containment, and semantic attack-signature memory, built on Google ADK + Vertex AI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Walid Benlekbir" }]

# Pinned to the versions verified working in Phase 0/1. google-genai and
# google-cloud-aiplatform are transitive to google-adk but pinned explicitly
# here because PHAGE imports them directly — a direct import is a direct dep.
#
# The [agent-engines] extra is REQUIRED, not cosmetic: it pulls cloudpickle
# (Agent Engine deployment for MARROW) and the OpenTelemetry GCP trace/logging
# exporters (SENTINEL's observability plumbing). Plain aiplatform drops them.
dependencies = [
    "google-adk==2.6.3",
    "google-cloud-aiplatform[agent-engines]==1.163.0",
    "google-genai==2.17.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phage"]
